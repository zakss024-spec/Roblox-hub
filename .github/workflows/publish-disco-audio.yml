name: Publish Disco Fever audio

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-disco-audio.yml"

permissions:
  contents: write

jobs:
  publish-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Download the user-provided MP3
        env:
          AUDIO_SOURCE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/5df9d470-dc1d-4af5-a19b-f7e3bb353d74.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDg2YTliOGU0YjcyNWE4MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTY0Mjg5NH0.5_hJeb0sLsnfgjRyHq00vq_a3usUbOX3YDHPzwyNU9w"
        run: |
          mkdir -p public/audio
          curl --fail --location --retry 3 "$AUDIO_SOURCE_URL" -o public/audio/garam-madu.mp3
          test "$(wc -c < public/audio/garam-madu.mp3)" -gt 100000
          file public/audio/garam-madu.mp3

      - name: Publish a permanent public release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view disco-audio-v1 >/dev/null 2>&1; then
            gh release create disco-audio-v1 --title "Disco Fever Audio" --notes "Audio asset used by the Roblox Hub Disco Fever admin event."
          fi
          gh release upload disco-audio-v1 public/audio/garam-madu.mp3 --clobber
